# Render Blueprint: one web service with a persistent disk for the database.
# In Render: New + → Blueprint → pick this repo. Then fill in the secret values it asks for.
services:
  - type: web
    name: golden-opinions
    runtime: docker
    plan: starter            # persistent disks need a paid plan
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "true"
      - key: BUSINESS_TZ
        value: America/Phoenix
      - key: APP_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_HOST
        sync: false
      - key: COMPANY_NAME
        sync: false
      - key: COMPANY_ADDRESS
        sync: false
      - key: INQUIRY_EMAIL
        value: connect@mygoldenopinions.com
      - key: SUPPORT_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: POSTMARK_SERVER_TOKEN
        sync: false
      - key: EMAIL_FROM
        sync: false
